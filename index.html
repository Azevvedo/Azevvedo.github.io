<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>IDK.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000'/%3E%3Cpath fill='%23fff' d='M50 9L68 27L50 45L32 27Z M73 32L91 50L73 68L55 50Z M50 55L68 73L50 91L32 73Z M27 32L45 50L27 68L9 50Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #fff; --muted: #777; --line: rgb(255 255 255 / 0.25); --err: #ff8a8a;
    --glow: 0 0 0.06em rgb(255 255 255 / 0.9), 0 0 0.28em rgb(130 170 255 / 0.8), 0 0 0.7em rgb(70 100 255 / 0.6);
    --pic-glow: 0 0 0.5rem rgb(255 255 255 / 0.35), 0 0 1.6rem rgb(120 160 255 / 0.7), 0 0 3.5rem rgb(70 100 255 / 0.45);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  html { overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: #000;
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    grid-template-rows: 1fr auto;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---------- Loading screen ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 50;
    background: #000;
    display: grid; place-items: center;
    transition: opacity 0.6s ease, visibility 0.6s;
  }
  #loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
  #loader svg {
    width: 76px; height: 76px;
    filter: drop-shadow(0 0 0.4rem rgb(130 170 255 / 0.9)) drop-shadow(0 0 1.3rem rgb(70 100 255 / 0.7));
  }
  #loader path {
    fill: #fff;
    transform-box: fill-box;
    transform-origin: center;
    animation: diamond 1.4s ease-in-out infinite;
  }
  #loader path:nth-child(2) { animation-delay: 0.175s; }
  #loader path:nth-child(3) { animation-delay: 0.35s; }
  #loader path:nth-child(4) { animation-delay: 0.525s; }
  @keyframes diamond {
    0%, 100% { opacity: 0.2; transform: scale(0.7); }
    40%      { opacity: 1;   transform: scale(1); }
  }

  /* ---------- The quote ---------- */
  main {
    display: grid;
    place-items: center;
    padding: clamp(1.25rem, 6vw, 4rem);
    padding-top: calc(clamp(1.25rem, 6vw, 4rem) + env(safe-area-inset-top, 0px));
    padding-left: max(clamp(1.25rem, 6vw, 4rem), env(safe-area-inset-left, 0px));
    padding-right: max(clamp(1.25rem, 6vw, 4rem), env(safe-area-inset-right, 0px));
    overflow: hidden;
  }
  #quote {
    margin: 0;
    max-width: 100%;
    text-align: center;
    font-size: clamp(3rem, 14vw, 10rem);
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.03em;
    user-select: none;
    -webkit-user-select: none;
  }
  #letters {
    text-shadow: var(--glow);
    animation: glowPulse 3.2s ease-in-out infinite;
  }
  #letters.calm { animation: none; } /* long texts and photos skip the text-glow pulse */
  @keyframes glowPulse {
    0%, 100% { text-shadow: var(--glow); }
    50% {
      text-shadow: 0 0 0.08em #fff, 0 0 0.38em rgb(160 190 255 / 0.95), 0 0 1em rgb(80 110 255 / 0.8);
    }
  }
  .word { display: inline-block; max-width: 100%; }
  .ch { display: inline-block; white-space: pre; }
  .in {
    display: inline-block;
    animation: bob 2.6s ease-in-out infinite;
    animation-delay: calc(var(--i) * -140ms);
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50%      { transform: translateY(-0.07em) rotate(1.5deg); }
  }

  /* A photo on the wall */
  #letters .pic {
    display: block;
    width: auto; height: auto;
    max-width: min(88vw, 900px);
    max-height: min(62vh, 720px);
    border-radius: 18px;
    box-shadow: var(--pic-glow);
    animation: picGlow 3.2s ease-in-out infinite;
    -webkit-user-drag: none;
  }
  @keyframes picGlow {
    0%, 100% { box-shadow: var(--pic-glow); }
    50% { box-shadow: 0 0 0.6rem rgb(255 255 255 / 0.5), 0 0 2.2rem rgb(150 185 255 / 0.9), 0 0 4.5rem rgb(80 110 255 / 0.65); }
  }

  /* Entrance animations: one is picked at random every time the wall changes */
  #letters[class*="fx-"] .ch {
    animation-duration: 1s;
    animation-fill-mode: both;
    animation-delay: calc(var(--i) * var(--step, 40ms));
  }
  .fx-drop  .ch { animation-name: drop;  animation-timing-function: cubic-bezier(.3, .7, .4, 1); animation-duration: 1.1s; }
  .fx-spin  .ch { animation-name: spin;  animation-timing-function: cubic-bezier(.2, .9, .3, 1.2); animation-duration: 1.1s; }
  .fx-zoom  .ch { animation-name: zoom;  animation-timing-function: cubic-bezier(.2, .9, .3, 1); animation-duration: .8s; }
  .fx-jelly .ch { animation-name: jelly; animation-timing-function: ease-out; animation-duration: 1s; }
  .fx-slide .ch { animation-name: slide; animation-timing-function: cubic-bezier(.2, .9, .3, 1); animation-duration: .9s; }
  .fx-flip  .ch { animation-name: flip;  animation-timing-function: cubic-bezier(.2, .9, .3, 1.3); animation-duration: .9s; }
  .fx-blast .ch { animation-name: blast; animation-timing-function: ease-out; animation-duration: 1.1s; }
  .fx-glitch .ch { animation-name: glitch; animation-timing-function: linear; animation-duration: .8s; }

  @keyframes drop {
    0%   { transform: translateY(-110vh) rotate(calc(var(--r) * 3deg)); opacity: 0; }
    8%   { opacity: 1; }
    50%  { transform: translateY(0) rotate(0); }
    65%  { transform: translateY(-16%); }
    80%  { transform: translateY(0); }
    90%  { transform: translateY(-5%); }
    100% { transform: none; opacity: 1; }
  }
  @keyframes spin {
    from { transform: rotate(calc(720deg + var(--r) * 40deg)) scale(0); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  @keyframes zoom {
    from { transform: scale(7); opacity: 0; filter: blur(14px); }
    to   { transform: none; opacity: 1; filter: blur(0); }
  }
  @keyframes jelly {
    0%   { transform: scale(0); }
    35%  { transform: scale(1.6, 0.5); }
    55%  { transform: scale(0.6, 1.4); }
    75%  { transform: scale(1.15, 0.9); }
    90%  { transform: scale(0.97, 1.05); }
    100% { transform: none; }
  }
  @keyframes slide {
    from { transform: translateX(calc(var(--dir) * 110vw)) skewX(calc(var(--dir) * -35deg)); }
    60%  { transform: translateX(calc(var(--dir) * -4%)) skewX(calc(var(--dir) * 8deg)); }
    to   { transform: none; }
  }
  @keyframes flip {
    from { transform: perspective(500px) rotateX(-100deg) translateY(-30%); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  @keyframes blast {
    0%   { transform: scale(2.4) rotate(calc(var(--r) * 1.6deg)); color: hsl(var(--h) 100% 62%); opacity: 0; }
    25%  { opacity: 1; }
    100% { transform: none; color: #fff; }
  }
  @keyframes glitch {
    0%   { transform: translate(calc(var(--r) * 1%), 0) skewX(30deg); text-shadow: -0.06em 0 #f0f, 0.06em 0 #0ff, var(--glow); opacity: 0; }
    20%  { transform: translate(-4%, 2%); text-shadow: 0.08em 0 #f0f, -0.08em 0 #0ff, var(--glow); opacity: 1; }
    40%  { transform: translate(5%, -3%) skewX(-12deg); }
    60%  { transform: translate(-2%, 1%); text-shadow: -0.05em 0 #f0f, 0.05em 0 #0ff, var(--glow); }
    80%  { transform: translate(1%, 0); }
    100% { transform: none; text-shadow: var(--glow); }
  }

  /* Whole-wall shake for the loud ones */
  #quote.shaking { animation: shake 0.6s 0.15s ease-in-out; }
  @keyframes shake {
    0%, 100% { transform: none; }
    15% { transform: translate(-12px, 5px) rotate(-1.2deg); }
    30% { transform: translate(10px, -6px) rotate(1deg); }
    45% { transform: translate(-8px, -4px) rotate(-0.8deg); }
    60% { transform: translate(7px, 6px) rotate(0.6deg); }
    80% { transform: translate(-3px, 2px); }
  }

  /* ---------- Minimal input ---------- */
  footer {
    padding: 0 1.25rem calc(1rem + env(safe-area-inset-bottom, 0px));
    padding-left: max(1.25rem, env(safe-area-inset-left, 0px));
    padding-right: max(1.25rem, env(safe-area-inset-right, 0px));
  }
  #note { margin: 0 0 0.4rem; text-align: center; font-size: 0.85rem; color: var(--muted); }
  #note:empty { display: none; }
  #note.error { color: var(--err); }
  form {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    max-width: 520px;
    margin: 0 auto;
  }
  #input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--ink);
    text-align: center;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    padding: 0.6rem 0;
  }
  #input::placeholder { color: var(--muted); }
  #input:focus { outline: none; border-bottom-color: var(--ink); }

  .round {
    flex: none;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    padding: 0;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 50%;
    cursor: pointer;
  }
  .round:hover:not(:disabled) { background: var(--ink); color: #000; }
  .round:disabled { opacity: 0.3; cursor: default; }
  .round:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .round.ghost { border-color: transparent; color: var(--muted); }
  .round.ghost:hover:not(:disabled) { background: transparent; color: var(--ink); }
  .round.small { width: 30px; height: 30px; }

  #pending {
    flex: 1; min-width: 0;
    display: flex; align-items: center; justify-content: center; gap: 0.7rem;
    min-height: 46px;
    padding: 0.35rem 0;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  #thumb {
    width: 34px; height: 34px; border-radius: 8px; object-fit: cover;
    box-shadow: 0 0 0.6rem rgb(120 160 255 / 0.6);
  }

  /* Used only while JS measures how big the text can be */
  .measuring .word { white-space: nowrap; max-width: none; }

  /* Phones and short (landscape) screens */
  @media (max-width: 700px), (max-height: 560px) {
    #quote { line-height: 1.05; letter-spacing: -0.02em; }
    footer { padding-bottom: calc(0.85rem + env(safe-area-inset-bottom, 0px)); }
    #input { font-size: 1.05rem; padding: 0.8rem 0; }
    .round { width: 46px; height: 46px; }
    .round.small { width: 32px; height: 32px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #letters, #letters .ch, .in, #quote, #letters .pic, #loader path { animation: none !important; }
    #loader path { opacity: 1; }
  }
</style>
</head>
<body>

<main>
  <h1 id="quote">
    <span class="sr" id="sr" aria-live="polite"></span>
    <span id="letters" aria-hidden="true"></span>
  </h1>
</main>

<footer>
  <p id="note" role="status"></p>
  <form id="form" autocomplete="off">
    <button class="round ghost" id="attach" type="button" aria-label="Send a photo instead" title="Send a photo instead">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>
    </button>
    <input type="file" id="file" accept="image/*" hidden>

    <input id="input" type="text" maxlength="200" enterkeyhint="send" placeholder="type something…" aria-label="New message for everyone">

    <div id="pending" hidden>
      <img id="thumb" alt="Photo ready to send">
      <span>photo ready</span>
      <button class="round ghost small" id="removeImg" type="button" aria-label="Remove photo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <button class="round" id="send" type="submit" aria-label="Send" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
</footer>

<div id="loader" role="status" aria-label="Loading">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 9L68 27L50 45L32 27Z"/>
    <path d="M73 32L91 50L73 68L55 50Z"/>
    <path d="M50 55L68 73L50 91L32 73Z"/>
    <path d="M27 32L45 50L27 68L9 50Z"/>
  </svg>
</div>

<script>
  const DB_URL = "https://github-7dded-default-rtdb.europe-west1.firebasedatabase.app";
  const NODE_URL = DB_URL.replace(/\/$/, "") + "/quote.json";
  const DEFAULT_TEXT = "type something below";
  const FX = ["drop", "spin", "zoom", "jelly", "slide", "flip", "blast", "glitch"];
  const MAX_IMAGE_CHARS = 900000; // photos are shrunk until they fit under this size

  const $ = (id) => document.getElementById(id);
  const quoteEl = $("quote"), lettersEl = $("letters"), srEl = $("sr");
  const input = $("input"), sendBtn = $("send"), noteEl = $("note");
  const attachBtn = $("attach"), fileInput = $("file");
  const pendingEl = $("pending"), thumbEl = $("thumb"), removeBtn = $("removeImg");
  const loader = $("loader");
  const mainEl = document.querySelector("main");
  const coarsePointer = window.matchMedia("(pointer: coarse)").matches;
  const compactMQ = window.matchMedia("(max-width: 700px), (max-height: 560px)");

  let state = {};
  let lastKey = null;     // what is currently on the wall (text or photo)
  let lastText = null;
  let mode = "text";
  let lastFx = null;
  let sending = false;
  let pendingImage = null;
  let renderSeq = 0;

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function setNote(msg, isError) {
    noteEl.textContent = msg;
    noteEl.classList.toggle("error", !!isError);
  }

  // ---------- text -> animated letters ----------
  const segmenter = window.Intl && Intl.Segmenter ? new Intl.Segmenter(undefined, { granularity: "grapheme" }) : null;
  const splitChars = (t) => segmenter ? Array.from(segmenter.segment(t), (s) => s.segment) : Array.from(t);

  function fontSizeFor(len) {
    if (len <= 12) return "clamp(3rem, 14vw, 10rem)";
    if (len <= 30) return "clamp(2.4rem, 10vw, 7rem)";
    if (len <= 80) return "clamp(1.8rem, 6.5vw, 4.5rem)";
    return "clamp(1.4rem, 4.5vw, 3rem)";
  }

  // On phones: find the biggest font size where the text fits the screen
  // without splitting words across lines.
  function fitToScreen() {
    const cs = getComputedStyle(mainEl);
    const availW = mainEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const availH = mainEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const words = lettersEl.querySelectorAll(".word");

    quoteEl.classList.add("measuring");
    let lo = 16, hi = Math.min(availW * 0.42, 180), best = lo;
    for (let n = 0; n < 9; n++) {
      const mid = (lo + hi) / 2;
      quoteEl.style.fontSize = mid + "px";
      let ok = quoteEl.offsetHeight <= availH;
      if (ok) {
        for (const w of words) {
          if (w.offsetWidth > availW) { ok = false; break; }
        }
      }
      if (ok) { best = mid; lo = mid; } else { hi = mid; }
    }
    quoteEl.classList.remove("measuring");
    quoteEl.style.fontSize = best.toFixed(1) + "px";
  }

  function applySize(text) {
    if (compactMQ.matches) fitToScreen();
    else quoteEl.style.fontSize = fontSizeFor(text.length);
  }

  function pickFx() {
    let fx;
    do { fx = FX[Math.floor(Math.random() * FX.length)]; } while (fx === lastFx);
    lastFx = fx;
    return fx;
  }

  function playEntrance(fx, calm) {
    lettersEl.className = "";
    void lettersEl.offsetWidth; // restart the animation
    lettersEl.className = "fx-" + fx + (calm ? " calm" : "");

    quoteEl.classList.remove("shaking");
    if (fx === "blast" || fx === "glitch" || fx === "drop") {
      void quoteEl.offsetWidth;
      quoteEl.classList.add("shaking");
    }
  }

  function renderText(text) {
    renderSeq++;
    const fx = pickFx();
    lettersEl.textContent = "";
    srEl.textContent = text;

    let i = 0;
    for (const token of text.split(/(\s+)/)) {
      if (!token) continue;
      if (/^\s+$/.test(token)) { lettersEl.append(document.createTextNode(" ")); continue; }
      const word = el("span", "word");
      for (const c of splitChars(token)) {
        const ch = el("span", "ch");
        ch.style.setProperty("--i", i);
        ch.style.setProperty("--h", (i * 37) % 360);
        ch.style.setProperty("--r", (Math.random() * 20 - 10).toFixed(1));
        ch.style.setProperty("--dir", i % 2 ? 1 : -1);
        ch.append(el("span", "in", c));
        word.append(ch);
        i++;
      }
      lettersEl.append(word);
    }

    applySize(text);

    // keep the whole entrance under ~1.4s, however long the text is
    lettersEl.style.setProperty("--step", Math.min(45, Math.floor(1400 / Math.max(i, 1))) + "ms");
    playEntrance(fx, text.length > (compactMQ.matches ? 30 : 60));
  }

  function renderImage(src) {
    const token = ++renderSeq;
    const img = new Image();
    img.className = "pic";
    img.alt = "";
    img.draggable = false;
    img.src = src;

    const show = () => {
      if (token !== renderSeq) return; // something newer arrived while decoding
      lettersEl.textContent = "";
      srEl.textContent = "A photo";

      const ch = el("span", "ch");
      ch.style.setProperty("--i", 0);
      ch.style.setProperty("--h", Math.floor(Math.random() * 360));
      ch.style.setProperty("--r", (Math.random() * 20 - 10).toFixed(1));
      ch.style.setProperty("--dir", Math.random() < 0.5 ? -1 : 1);
      const inner = el("span", "in");
      inner.append(img);
      ch.append(inner);
      lettersEl.append(ch);

      lettersEl.style.setProperty("--step", "0ms");
      playEntrance(pickFx(), true);
    };
    (img.decode ? img.decode() : Promise.resolve()).then(show, show);
  }

  function render() {
    const image = typeof state.image === "string" && state.image.startsWith("data:image/") ? state.image : null;
    if (image) {
      const key = "i:" + image;
      if (key === lastKey) return;
      lastKey = key;
      mode = "image";
      renderImage(image);
      return;
    }
    const text = typeof state.text === "string" && state.text ? state.text : DEFAULT_TEXT;
    const key = "t:" + text;
    if (key === lastKey) return;
    lastKey = key;
    lastText = text;
    mode = "text";
    renderText(text);
  }

  // ---------- loading screen ----------
  // Stays up until the font and the first data are ready, so the first
  // entrance animation plays as the loader fades out.
  let firstData = false, revealed = false, fontsReady = false, minTime = false;

  function maybeReveal(force) {
    if (revealed) return;
    if (!force && !(firstData && fontsReady && minTime)) return;
    revealed = true;
    render();
    loader.classList.add("done");
    setTimeout(() => loader.remove(), 900);
  }
  function onData() {
    firstData = true;
    if (revealed) render(); else maybeReveal();
  }

  const fontLoad = document.fonts && document.fonts.load
    ? document.fonts.load('800 1em "Bricolage Grotesque"', "Ag").catch(() => {})
    : Promise.resolve();
  Promise.race([fontLoad, sleep(3000)]).then(() => { fontsReady = true; maybeReveal(); });
  setTimeout(() => { minTime = true; maybeReveal(); }, 800);
  setTimeout(() => maybeReveal(true), 6000); // never get stuck on the loader

  // ---------- live connection ----------
  function setPath(obj, parts, val) {
    if (!parts.length) return;
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      if (typeof cur[parts[i]] !== "object" || cur[parts[i]] === null) cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    const last = parts[parts.length - 1];
    if (val === null) delete cur[last]; else cur[last] = val;
  }

  function connect() {
    const es = new EventSource(NODE_URL);

    es.addEventListener("open", () => setNote(""));

    es.addEventListener("error", () => {
      if (es.readyState === EventSource.CLOSED) {
        setNote("can't reach the database", true);
      } else {
        setNote("reconnecting…");
      }
    });

    es.addEventListener("put", (e) => {
      const { path, data } = JSON.parse(e.data);
      const parts = path.split("/").filter(Boolean);
      if (!parts.length) state = data && typeof data === "object" ? data : {};
      else setPath(state, parts, data);
      onData();
    });

    es.addEventListener("patch", (e) => {
      const { data } = JSON.parse(e.data);
      for (const [p, v] of Object.entries(data || {})) setPath(state, p.split("/").filter(Boolean), v);
      onData();
    });
  }

  // ---------- photos ----------
  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("load")); };
      img.src = url;
    });
  }

  // Shrink the photo so it is small enough to store in the database.
  async function compress(file) {
    const img = await loadImage(file);
    const sizes = [900, 720, 560];
    const qualities = [0.72, 0.6, 0.5];
    for (let i = 0; i < sizes.length; i++) {
      const scale = Math.min(1, sizes[i] / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const url = canvas.toDataURL("image/jpeg", qualities[i]);
      if (url.length <= MAX_IMAGE_CHARS) return url;
    }
    throw new Error("too big");
  }

  function setPendingUI(on) {
    pendingEl.hidden = !on;
    input.hidden = on;
    if (on) input.value = "";
    updateSend();
  }

  attachBtn.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (!file) return;
    if (!file.type.startsWith("image/")) { setNote("pick an image file", true); return; }
    setNote("preparing photo…");
    try {
      pendingImage = await compress(file);
      thumbEl.src = pendingImage;
      setPendingUI(true);
      setNote("");
    } catch (err) {
      setNote("couldn't use that photo, try another", true);
    }
  });

  removeBtn.addEventListener("click", () => {
    pendingImage = null;
    setPendingUI(false);
    if (!coarsePointer) input.focus();
  });

  // ---------- sending ----------
  function updateSend() {
    sendBtn.disabled = sending || (!pendingImage && !input.value.trim());
    attachBtn.disabled = sending;
  }
  input.addEventListener("input", updateSend);

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (sending || (!pendingImage && !text)) return;

    sending = true;
    updateSend();
    // a photo replaces the text, and text replaces a photo
    const payload = pendingImage ? { image: pendingImage, at: Date.now() } : { text: text, at: Date.now() };
    try {
      const res = await fetch(NODE_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      input.value = "";
      pendingImage = null;
      setPendingUI(false);
      setNote("");
    } catch (err) {
      setNote("couldn't save, try again", true);
    } finally {
      sending = false;
      updateSend();
      if (!coarsePointer && !input.hidden) input.focus();
    }
  });

  // ---------- refit on rotate / font load ----------
  let lastWidth = window.innerWidth;
  let resizeTimer;
  const refit = () => { if (mode === "text" && lastText) applySize(lastText); };
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      // the on-screen keyboard changes the height, not the width: leave the text alone
      if (document.activeElement === input && window.innerWidth === lastWidth) return;
      lastWidth = window.innerWidth;
      refit();
    }, 150);
  });
  if (document.fonts) {
    document.fonts.ready.then(refit);
    document.fonts.addEventListener("loadingdone", refit);
  }

  connect();
</script>
</body>
</html>
