<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2b2df0;
    --panel: #1c1ebf;
    --ink: #ffffff;
    --soft: #b9baff;
    --pop: #ffe14d;
    --on-pop: #14155e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    grid-template-rows: 1fr auto;
    min-height: 100dvh;
  }

  main {
    display: flex;
    align-items: center;
    padding: clamp(1.25rem, 6vw, 5rem);
  }
  #quote {
    margin: 0;
    font-size: clamp(2.6rem, 11vw, 8.5rem);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.035em;
    text-wrap: balance;
    overflow-wrap: anywhere;
    max-width: 16ch;
  }
  #quote.flash { animation: flash 1.1s ease-out; }
  @keyframes flash {
    from { color: var(--pop); }
    to   { color: var(--ink); }
  }

  footer {
    background: var(--panel);
    padding: clamp(1rem, 3vw, 1.75rem) clamp(1.25rem, 6vw, 5rem);
    display: grid;
    gap: 0.75rem;
  }
  form {
    display: flex;
    gap: 1rem;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  label { flex: 1 1 18rem; display: grid; gap: 0.35rem; font-size: 0.95rem; color: var(--soft); }
  textarea {
    font: inherit;
    font-size: 1.25rem;
    font-weight: 500;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 2px solid var(--soft);
    padding: 0.4rem 0;
    resize: none;
    width: 100%;
    min-height: 3.2rem;
  }
  textarea::placeholder { color: var(--soft); opacity: 0.7; }
  textarea:focus { outline: none; border-bottom-color: var(--pop); }
  button {
    font: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    background: var(--pop);
    color: var(--on-pop);
    border: 0;
    border-radius: 999px;
    padding: 0.85rem 1.6rem;
    cursor: pointer;
  }
  button:hover:not(:disabled) { filter: brightness(1.06); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { margin: 0; font-size: 0.9rem; color: var(--soft); min-height: 1.3em; }
  #status.error { color: var(--pop); }

  @media (prefers-reduced-motion: reduce) {
    #quote.flash { animation: none; }
  }
</style>
</head>
<body>

<main>
  <h1 id="quote" aria-live="polite">Loading…</h1>
</main>

<footer>
  <form id="form">
    <label>
      Change what everyone sees
      <textarea id="input" maxlength="200" rows="1" placeholder="Type something…"></textarea>
    </label>
    <button id="send" type="submit">Change it for everyone</button>
  </form>
  <p id="status"></p>
</footer>

<script>
  // ------------------------------------------------------------------
  // 1. Paste your Firebase Realtime Database URL here (see setup steps).
  //    It looks like: https://my-project-default-rtdb.firebaseio.com
  // ------------------------------------------------------------------
  const DB_URL = "https://github-7dded-default-rtdb.europe-west1.firebasedatabase.app";

  const DEFAULT_TEXT = "Nothing here yet. Write something below.";
  const NODE_URL = DB_URL.replace(/\/$/, "") + "/quote.json";

  const $ = (id) => document.getElementById(id);
  const quoteEl = $("quote");
  const inputEl = $("input");
  const sendEl = $("send");
  const statusEl = $("status");

  let state = {};
  let lastText = null;
  let prefilled = false;
  let connected = false;

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.classList.toggle("error", !!isError);
  }

  function timeAgo(ms) {
    const s = Math.round((Date.now() - ms) / 1000);
    if (s < 10) return "just now";
    if (s < 60) return s + " seconds ago";
    const m = Math.round(s / 60);
    if (m < 60) return m + (m === 1 ? " minute ago" : " minutes ago");
    const h = Math.round(m / 60);
    if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
    const d = Math.round(h / 24);
    return d + (d === 1 ? " day ago" : " days ago");
  }

  function refreshStatus() {
    if (!connected) return;
    setStatus(state.at ? "Last changed " + timeAgo(state.at) : "Connected");
  }

  function render() {
    const text = typeof state.text === "string" && state.text ? state.text : DEFAULT_TEXT;
    if (text !== lastText) {
      quoteEl.textContent = text;
      if (lastText !== null) {
        quoteEl.classList.remove("flash");
        void quoteEl.offsetWidth; // restart the animation
        quoteEl.classList.add("flash");
      }
      lastText = text;
    }
    if (!prefilled && typeof state.text === "string") {
      inputEl.value = state.text;
      prefilled = true;
    }
    refreshStatus();
  }

  function connect() {
    const es = new EventSource(NODE_URL);

    es.addEventListener("open", () => { connected = true; refreshStatus(); });

    es.addEventListener("error", () => {
      connected = false;
      if (es.readyState === EventSource.CLOSED) {
        setStatus("Can't reach the database. Check the URL and the rules in Firebase.", true);
      } else {
        setStatus("Reconnecting…");
      }
    });

    es.addEventListener("put", (e) => {
      const { path, data } = JSON.parse(e.data);
      if (path === "/") {
        state = data && typeof data === "object" ? data : {};
      } else {
        const key = path.split("/")[1];
        if (data === null) delete state[key]; else state[key] = data;
      }
      connected = true;
      render();
    });

    es.addEventListener("patch", (e) => {
      const { data } = JSON.parse(e.data);
      Object.assign(state, data);
      render();
    });
  }

  async function save(text) {
    sendEl.disabled = true;
    setStatus("Saving…");
    try {
      const res = await fetch(NODE_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text, at: Date.now() })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      setStatus("Saved. Everyone sees it now.");
    } catch (err) {
      setStatus("Couldn't save. Check your connection and try again.", true);
    } finally {
      sendEl.disabled = false;
    }
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) { setStatus("Write something first.", true); return; }
    save(text);
  });

  // Ctrl/Cmd + Enter also sends; plain Enter sends too (Shift+Enter = new line)
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      $("form").requestSubmit();
    }
  });

  setInterval(refreshStatus, 30000);

  if (DB_URL.includes("PASTE_YOUR")) {
    quoteEl.textContent = "Add your database URL in index.html";
    quoteEl.style.fontSize = "clamp(2rem, 7vw, 5rem)";
    inputEl.disabled = true;
    sendEl.disabled = true;
    setStatus("Setup needed: open index.html and replace PASTE_YOUR_DATABASE_URL_HERE.", true);
  } else {
    connect();
  }
</script>
</body>
</html>
